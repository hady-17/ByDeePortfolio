name: CI

# Checks that the site still builds. Deployment is handled by Vercel, not here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check key pages were generated
        run: |
          for f in dist/index.html dist/ar/index.html dist/sitemap-index.xml dist/robots.txt dist/privacy/index.html dist/treatments/signature-facial/index.html; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          echo "All key pages present."
