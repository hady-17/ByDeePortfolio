name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local file references exist
        run: |
          python3 - <<'EOF'
          import re, os, sys
          html = open('index.html', encoding='utf-8').read()
          refs = set(re.findall(r'(?:src|href)="([^"#?:]+?)"', html))
          refs |= set(re.findall(r'(\S+\.(?:webp|jpg|png|svg)) \d+w', html))
          missing = [r for r in sorted(refs) if not r.startswith(('http', '//', 'mailto', 'tel', 'data')) and not os.path.exists(r)]
          if missing:
              print('Missing files referenced in index.html:')
              for m in missing: print(' -', m)
              sys.exit(1)
          print('All local references found.')
          EOF

      - name: Check JavaScript syntax
        run: node --check js/main.js

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
          [ -d assets ] && cp -r assets _site/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
